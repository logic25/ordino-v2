name: CI

# Runs tests + build before code ships. Ordino auto-deploys from GitHub via
# Lovable/Supabase, so this is the gate that catches regressions before prod.
on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # Lint is informational for now (pre-existing warnings shouldn't block a
      # merge); tests and build are the hard gate.
      - name: Lint
        run: npm run lint
        continue-on-error: true

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build
